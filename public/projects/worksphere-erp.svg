  <text x="225" y="125" fill="#F7F5F0" font-family="'Outfit', sans-serif" font-size="24" font-weight="700">1,248</text>

  <rect x="398" y="70" width="175" height="70" rx="8" fill="#19191F" stroke="#303038" stroke-width="1" />
  <text x="413" y="93" fill="#777783" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">ACTIVE SESSIONS</text>
  <text x="413" y="125" fill="#D6B77A" font-family="'Outfit', sans-serif" font-size="24" font-weight="700">99.8%</text>

  <rect x="585" y="70" width="190" height="70" rx="8" fill="#19191F" stroke="#303038" stroke-width="1" />
