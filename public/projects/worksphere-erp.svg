  <text x="230" y="174" fill="#777783" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">EMP_ID</text>
  <text x="310" y="174" fill="#777783" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">EMPLOYEE NAME</text>
  <text x="450" y="174" fill="#777783" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">DEPARTMENT</text>
