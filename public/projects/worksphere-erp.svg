  <text x="310" y="212" fill="#F7F5F0" font-family="'Outfit', sans-serif" font-size="12" font-weight="600">Adarsh Anand</text>
  <text x="450" y="212" fill="#777783" font-family="'Outfit', sans-serif" font-size="12">Backend Engineering</text>
  <text x="585" y="212" fill="#777783" font-family="'Outfit', sans-serif" font-size="12">Java Developer</text>
  <rect x="695" y="198" width="55" height="18" rx="4" fill="rgba(214, 183, 122, 0.12)" stroke="#D6B77A" stroke-width="1" />
  <text x="707" y="211" fill="#D6B77A" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">ACTIVE</text>
  <line x1="225" y1="225" x2="760" y2="225" stroke="#303038" stroke-width="0.8" />

  <!-- Row 2 -->
  <text x="230" y="247" fill="#D6B77A" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">#WS-1043</text>
  <text x="310" y="247" fill="#F7F5F0" font-family="'Outfit', sans-serif" font-size="12" font-weight="600">Vikramaditya S.</text>
  <text x="450" y="247" fill="#777783" font-family="'Outfit', sans-serif" font-size="12">Database Architecture</text>
  <text x="585" y="247" fill="#777783" font-family="'Outfit', sans-serif" font-size="12">SQL DBA</text>
  <rect x="695" y="233" width="55" height="18" rx="4" fill="rgba(214, 183, 122, 0.12)" stroke="#D6B77A" stroke-width="1" />
  <text x="707" y="246" fill="#D6B77A" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">ACTIVE</text>
  <line x1="225" y1="260" x2="760" y2="260" stroke="#303038" stroke-width="0.8" />

  <!-- Row 3 -->
  <text x="230" y="282" fill="#D6B77A" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">#WS-1044</text>
  <text x="310" y="282" fill="#F7F5F0" font-family="'Outfit', sans-serif" font-size="12" font-weight="600">Elena Rostova</text>
  <text x="450" y="282" fill="#777783" font-family="'Outfit', sans-serif" font-size="12">Infrastructure Ops</text>
  <text x="585" y="282" fill="#777783" font-family="'Outfit', sans-serif" font-size="12">DevOps Lead</text>
  <rect x="695" y="268" width="55" height="18" rx="4" fill="rgba(214, 183, 122, 0.12)" stroke="#D6B77A" stroke-width="1" />
  <text x="707" y="281" fill="#D6B77A" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">ACTIVE</text>
  <line x1="225" y1="295" x2="760" y2="295" stroke="#303038" stroke-width="0.8" />

  <!-- Bottom SQL Query Log Console -->
  <rect x="225" y="315" width="535" height="98" rx="6" fill="#101014" stroke="#303038" stroke-width="1" />
  <text x="240" y="336" fill="#D6B77A" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">&gt; SELECT emp_id, name, department, salary FROM employees WHERE status = 'ACTIVE' LIMIT 10;</text>
  <text x="240" y="356" fill="#777783" font-family="'JetBrains Mono', monospace" font-size="9.5">Transaction committed in 3.4ms | PreparedStatement parameter bindings sanitized.</text>
  <text x="240" y="376" fill="#777783" font-family="'JetBrains Mono', monospace" font-size="9.5">Referential integrity enforced via foreign keys (ON DELETE CASCADE).</text>
  <text x="240" y="396" fill="#D6B77A" font-family="'JetBrains Mono', monospace" font-size="9.5">JDBC Connection Pool: 0 idle wait time | Thread pool safety: PASS</text>
