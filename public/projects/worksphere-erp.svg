<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-charcoal-ws" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0b0d12" />
      <stop offset="100%" stopColor="#151922" />
    </linearGradient>
    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#f1f5f9" />
      <stop offset="100%" stopColor="#94a3b8" />
    </linearGradient>
    <filter id="neon-glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-charcoal-ws)" />

  <!-- Grid overlay -->
  <g stroke="#232936" stroke-width="0.8" opacity="0.35">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="110" x2="800" y2="110" />
    <line x1="0" y1="170" x2="800" y2="170" />
    <line x1="0" y1="230" x2="800" y2="230" />
    <line x1="0" y1="290" x2="800" y2="290" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="410" x2="800" y2="410" />
  </g>

  <!-- Header Window Top Bar -->
  <rect x="30" y="25" width="740" height="38" rx="8" fill="#181c25" stroke="#2c3343" stroke-width="1" />
  <circle cx="50" cy="44" r="5" fill="#ff1e38" />
  <circle cx="68" cy="44" r="5" fill="#4a5568" />
  <circle cx="86" cy="44" r="5" fill="#4a5568" />
  <text x="110" y="48" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">WorkSphere ERP — Enterprise Workforce Management Backend [Java 17 / MySQL / JDBC]</text>
  <rect x="685" y="34" width="70" height="20" rx="4" fill="rgba(255, 30, 56, 0.12)" stroke="#ff1e38" stroke-width="1" />
  <text x="696" y="48" fill="#ff1e38" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">ONLINE</text>

  <!-- Left Sidebar Navigation -->
  <rect x="30" y="75" width="160" height="345" rx="8" fill="#11151d" stroke="#222835" stroke-width="1.2" />
  <text x="45" y="105" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">CORE MODULES</text>
  
  <rect x="40" y="120" width="140" height="28" rx="5" fill="rgba(255, 30, 56, 0.12)" stroke="#ff1e38" stroke-width="1" />
  <text x="50" y="138" fill="#ff1e38" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">▸ Employee Registry</text>
  
  <text x="50" y="172" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9.5">▹ Departments</text>
  <text x="50" y="204" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9.5">▹ Payroll Ledger</text>
  <text x="50" y="236" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9.5">▹ Role Permissions</text>
  <text x="50" y="268" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9.5">▹ Audit Logging</text>

  <rect x="40" y="345" width="140" height="60" rx="6" fill="#181c25" stroke="#29303e" stroke-width="1" />
  <text x="48" y="365" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">DATABASE POOL</text>
  <text x="48" y="380" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">MySQL Connection</text>
  <circle cx="53" cy="393" r="3.5" fill="#ff1e38" filter="url(#neon-glow-red)" />
  <text x="63" y="396" fill="#ff1e38" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700">JDBC HEALTHY</text>

  <!-- Middle Dashboard: Metrics & Data Table -->
  <g transform="translate(205, 75)">
    <!-- 3 Quick Cards -->
    <rect x="0" y="0" width="175" height="65" rx="6" fill="#141820" stroke="#262d3a" stroke-width="1" />
    <text x="14" y="22" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">TOTAL WORKFORCE</text>
    <text x="14" y="48" fill="#f1f5f9" font-family="'Outfit', sans-serif" font-size="18" font-weight="700">1,248 Active</text>

    <rect x="190" y="0" width="175" height="65" rx="6" fill="#141820" stroke="#262d3a" stroke-width="1" />
    <text x="14" y="22" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5" transform="translate(190, 0)">CRUD OPERATIONS</text>
    <text x="14" y="48" fill="#ff1e38" font-family="'Outfit', sans-serif" font-size="18" font-weight="700" transform="translate(190, 0)">99.98% OK</text>

    <rect x="380" y="0" width="185" height="65" rx="6" fill="#141820" stroke="#262d3a" stroke-width="1" />
    <text x="14" y="22" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5" transform="translate(380, 0)">SQL EXECUTION TIME</text>
    <text x="14" y="48" fill="#f1f5f9" font-family="'Outfit', sans-serif" font-size="18" font-weight="700" transform="translate(380, 0)">3.4 ms AVG</text>

    <!-- Data Table Container -->
    <rect x="0" y="80" width="565" height="265" rx="8" fill="#12161f" stroke="#262d3a" stroke-width="1" />
    
    <!-- Table Header -->
    <rect x="0" y="80" width="565" height="32" rx="8" fill="#1b202a" />
    <text x="16" y="101" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">EMP_ID</text>
    <text x="80" y="101" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">FULL NAME</text>
    <text x="220" y="101" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">ROLE / POSITION</text>
    <text x="360" y="101" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">DEPARTMENT</text>
    <text x="480" y="101" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">STATUS</text>

    <!-- Table Rows -->
    <g font-family="'JetBrains Mono', monospace" font-size="9">
      <!-- Row 1 -->
      <line x1="0" y1="145" x2="565" y2="145" stroke="#1d232e" stroke-width="1" />
      <text x="16" y="133" fill="#94a3b8">#0481</text>
      <text x="80" y="133" fill="#f1f5f9" font-weight="600">Adarsh A</text>
      <text x="220" y="133" fill="#cbd5e1">Java Backend Engineer</text>
      <text x="360" y="133" fill="#94a3b8">Engineering</text>
      <rect x="478" y="122" width="60" height="17" rx="3" fill="rgba(255, 30, 56, 0.15)" stroke="#ff1e38" stroke-width="0.8" />
      <text x="490" y="134" fill="#ff1e38" font-weight="700">ACTIVE</text>

      <!-- Row 2 -->
      <line x1="0" y1="180" x2="565" y2="180" stroke="#1d232e" stroke-width="1" />
      <text x="16" y="168" fill="#94a3b8">#0482</text>
      <text x="80" y="168" fill="#f1f5f9">Rahul Verma</text>
      <text x="220" y="168" fill="#cbd5e1">Database Administrator</text>
      <text x="360" y="168" fill="#94a3b8">DevOps / Data</text>
      <rect x="478" y="157" width="60" height="17" rx="3" fill="rgba(255, 30, 56, 0.15)" stroke="#ff1e38" stroke-width="0.8" />
      <text x="490" y="169" fill="#ff1e38" font-weight="700">ACTIVE</text>

      <!-- Row 3 -->
      <line x1="0" y1="215" x2="565" y2="215" stroke="#1d232e" stroke-width="1" />
      <text x="16" y="203" fill="#94a3b8">#0483</text>
      <text x="80" y="203" fill="#f1f5f9">Ananya Sen</text>
      <text x="220" y="203" fill="#cbd5e1">Full Stack Developer</text>
      <text x="360" y="203" fill="#94a3b8">Product Team</text>
      <rect x="478" y="192" width="60" height="17" rx="3" fill="rgba(255, 30, 56, 0.15)" stroke="#ff1e38" stroke-width="0.8" />
      <text x="490" y="204" fill="#ff1e38" font-weight="700">ACTIVE</text>

      <!-- Row 4 -->
      <line x1="0" y1="250" x2="565" y2="250" stroke="#1d232e" stroke-width="1" />
      <text x="16" y="238" fill="#94a3b8">#0484</text>
      <text x="80" y="238" fill="#f1f5f9">Vikram Nair</text>
      <text x="220" y="238" fill="#cbd5e1">QA & Test Automation</text>
      <text x="360" y="238" fill="#94a3b8">Quality Assur.</text>
      <rect x="478" y="227" width="60" height="17" rx="3" fill="rgba(255, 30, 56, 0.15)" stroke="#ff1e38" stroke-width="0.8" />
      <text x="490" y="239" fill="#ff1e38" font-weight="700">ACTIVE</text>
      
      <!-- Query Terminal line at bottom -->
      <rect x="15" y="280" width="535" height="48" rx="5" fill="#0b0e14" stroke="#252c39" stroke-width="1" />
      <text x="28" y="300" fill="#94a3b8" font-size="8.5">SQL Persist: SELECT * FROM employees WHERE status = 'ACTIVE' ORDER BY hire_date DESC LIMIT 20;</text>
      <text x="28" y="316" fill="#ff1e38" font-size="8.5" font-weight="700">JDBC Connection pool status: 12 idle / 4 active / 0 wait queue (OK)</text>
    </g>
  </g>
</svg>
