<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-charcoal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0a0c10" />
      <stop offset="100%" stopColor="#141820" />
    </linearGradient>
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#ff1e38" />
      <stop offset="100%" stopColor="#ff4d64" />
    </linearGradient>
    <filter id="neon-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bg-charcoal)" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="#262c38" stroke-width="0.8" opacity="0.4">
    <line x1="40" y1="0" x2="40" height="450" />
    <line x1="120" y1="0" x2="120" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="280" y1="0" x2="280" y2="450" />
    <line x1="360" y1="0" x2="360" y2="450" />
    <line x1="440" y1="0" x2="440" y2="450" />
    <line x1="520" y1="0" x2="520" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="680" y1="0" x2="680" y2="450" />
    <line x1="760" y1="0" x2="760" y2="450" />
    <line x1="0" y1="60" x2="800" y2="60" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="0" y1="420" x2="800" y2="420" />
  </g>

  <!-- Window Header Bar -->
  <rect x="30" y="25" width="740" height="38" rx="8" fill="#1b202a" stroke="#2e3544" stroke-width="1" />
  <circle cx="50" cy="44" r="5" fill="#ff1e38" opacity="0.9" />
  <circle cx="68" cy="44" r="5" fill="#4a5568" />
  <circle cx="86" cy="44" r="5" fill="#4a5568" />
  <text x="110" y="48" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">PrintGuard AI — Edge Computer Vision Telemetry Feed [CAM_01: ACTIVE]</text>
  <rect x="680" y="34" width="75" height="20" rx="4" fill="rgba(255, 30, 56, 0.15)" stroke="#ff1e38" stroke-width="1" />
  <text x="692" y="48" fill="#ff1e38" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">LIVE FEED</text>

  <!-- Main Viewport Panel -->
  <rect x="30" y="75" width="480" height="345" rx="8" fill="#101319" stroke="#222834" stroke-width="1.2" />

  <!-- 3D Printer Bed Isometric Projection -->
  <g transform="translate(70, 110)">
    <!-- Base Plate -->
    <polygon points="200,60 380,140 200,220 20,140" fill="#181d27" stroke="#333b4d" stroke-width="1.5" />
    <polygon points="200,85 350,150 200,215 50,150" fill="#1c222e" stroke="#2a3242" stroke-dasharray="4,4" />

    <!-- 3D Printed Object In Progress -->
    <path d="M170,160 L230,160 L240,110 L160,110 Z" fill="#2d3546" stroke="#4a5568" stroke-width="1.5" />
    <path d="M160,110 L240,110 L220,70 L180,70 Z" fill="#3b4458" stroke="#5c6a82" stroke-width="1.5" />
    
    <!-- Spaghetti / Defect simulation in Neon Red -->
    <path d="M220,70 Q245,60 250,85 T275,100 T260,125" fill="none" stroke="#ff1e38" stroke-width="2.5" filter="url(#neon-blur)" />
    <path d="M225,75 Q260,80 270,105" fill="none" stroke="#ff1e38" stroke-width="1.5" />

    <!-- Print Head Nozzle -->
    <line x1="200" y1="20" x2="200" y2="65" stroke="#94a3b8" stroke-width="3" />
    <polygon points="190,65 210,65 200,75" fill="#e2e8f0" stroke="#ff1e38" stroke-width="1.5" />
    <circle cx="200" cy="76" r="3" fill="#ff1e38" filter="url(#neon-blur)" />
    
    <!-- AI YOLOv8 Bounding Box overlay in Neon Red -->
    <rect x="145" y="55" width="135" height="85" fill="rgba(255, 30, 56, 0.08)" stroke="#ff1e38" stroke-width="1.8" stroke-dasharray="6,4" />
    <rect x="145" y="38" width="135" height="17" fill="#ff1e38" />
    <text x="150" y="50" fill="#090b0e" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800">DEFECT DETECTED: 98.4%</text>

    <!-- Caliper crosshair -->
    <circle cx="200" cy="95" r="16" fill="none" stroke="#ff1e38" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="180" y1="95" x2="220" y2="95" stroke="#ff1e38" stroke-width="0.8" />
    <line x1="200" y1="75" x2="200" y2="115" stroke="#ff1e38" stroke-width="0.8" />
  </g>

  <!-- Right Sidebar - Telemetry & Analytics -->
  <rect x="525" y="75" width="245" height="345" rx="8" fill="#13161f" stroke="#222834" stroke-width="1.2" />
  
  <text x="545" y="105" fill="#f1f5f9" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">INFERENCE TELEMETRY</text>
  <line x1="545" y1="116" x2="745" y2="116" stroke="#262c3a" stroke-width="1" />

  <!-- Metric 1: FPS / Latency -->
  <g transform="translate(545, 130)">
    <rect width="205" height="52" rx="6" fill="#1a1e27" stroke="#2c3342" stroke-width="1" />
    <text x="14" y="20" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">INFERENCE LATENCY</text>
    <text x="14" y="40" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">18.2 ms</text>
    <text x="150" y="40" fill="#ff1e38" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">55 FPS</text>
  </g>

  <!-- Metric 2: OctoPrint Automation -->
  <g transform="translate(545, 195)">
    <rect width="205" height="52" rx="6" fill="#1a1e27" stroke="#2c3342" stroke-width="1" />
    <text x="14" y="20" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">OCTOPRINT SAFETY</text>
    <text x="14" y="40" fill="#ff1e38" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800">PAUSE TRIGGERED</text>
  </g>

  <!-- Metric 3: Model Architecture -->
  <g transform="translate(545, 260)">
    <rect width="205" height="85" rx="6" fill="#1a1e27" stroke="#2c3342" stroke-width="1" />
    <text x="14" y="20" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">MODEL PIPELINE</text>
    <text x="14" y="40" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">→ YOLOv8 Nano Edge</text>
    <text x="14" y="58" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">→ OpenCV Video Stream</text>
    <text x="14" y="74" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">→ OctoPi REST Socket</text>
  </g>

  <!-- Bottom Hardware Node Bar -->
  <rect x="545" y="360" width="205" height="42" rx="6" fill="#161a23" stroke="#ff1e38" stroke-width="1" opacity="0.9" />
  <circle cx="560" cy="381" r="4" fill="#ff1e38" filter="url(#neon-blur)" />
  <text x="572" y="385" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">EMBEDDED RASPBERRY PI 4</text>
</svg>
