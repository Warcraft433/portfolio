<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-black-charcoal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#08080b" />
      <stop offset="100%" stopColor="#12131a" />
    </linearGradient>
    <linearGradient id="laser-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#ff1744" />
      <stop offset="100%" stopColor="#00e5ff" />
    </linearGradient>
    <filter id="neon-glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="neon-glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bg-black-charcoal)" />
  
  <!-- Subtle Technical Grid Lines -->
  <g stroke="#252733" stroke-width="0.8" opacity="0.4">
    <line x1="40" y1="0" x2="40" y2="450" />
    <line x1="120" y1="0" x2="120" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="280" y1="0" x2="280" y2="450" />
    <line x1="360" y1="0" x2="360" y2="450" />
    <line x1="440" y1="0" x2="440" y2="450" />
    <line x1="520" y1="0" x2="520" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="680" y1="0" x2="680" y2="450" />
    <line x1="760" y1="0" x2="760" y2="450" />
    <line x1="0" y1="60" x2="800" y2="60" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="0" y1="420" x2="800" y2="420" />
  </g>

  <!-- Window Header Bar -->
  <rect x="30" y="25" width="740" height="38" rx="8" fill="#12131a" stroke="#252733" stroke-width="1" />
  <circle cx="50" cy="44" r="5" fill="#ff1744" opacity="0.95" filter="url(#neon-glow-red)" />
  <circle cx="68" cy="44" r="5" fill="#00e5ff" opacity="0.8" filter="url(#neon-glow-blue)" />
  <circle cx="86" cy="44" r="5" fill="#71758c" />
  <text x="110" y="48" fill="#9da1b5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">PrintGuard AI — Edge Computer Vision Telemetry Feed [CAM_01: ACTIVE]</text>
  
  <rect x="665" y="34" width="90" height="20" rx="4" fill="rgba(255, 23, 68, 0.15)" stroke="#ff1744" stroke-width="1" />
  <circle cx="677" cy="44" r="3" fill="#ff1744" />
  <text x="687" y="48" fill="#ff1744" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">LIVE FEED</text>

  <!-- Left Camera Stream Viewport Container -->
  <rect x="30" y="75" width="510" height="345" rx="8" fill="#0c0d12" stroke="#252733" stroke-width="1" />
  
  <!-- Optical Crosshair (Neon Blue & Gray) -->
  <line x1="285" y1="85" x2="285" y2="410" stroke="#00e5ff" stroke-width="0.8" stroke-dasharray="3,6" opacity="0.35" />
  <line x1="40" y1="247" x2="530" y2="247" stroke="#00e5ff" stroke-width="0.8" stroke-dasharray="3,6" opacity="0.35" />
  
  <!-- Simulated 3D Printer Heated Bed Wireframe -->
  <polygon points="120,340 450,340 490,260 160,260" fill="#171822" stroke="#363847" stroke-width="1.2" />
  <polygon points="200,285 410,285 435,230 225,230" fill="#1e1f2b" stroke="#4e5166" stroke-width="0.8" opacity="0.8" />
  
  <!-- 3D Printed Part Outline -->
  <path d="M 270 270 L 270 190 L 340 190 L 340 270 Z" fill="#242636" stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.8" />
  
  <!-- Filament Spaghetti Failure Threads in Neon Red with subtle Neon Blue glow -->
  <path d="M 330 195 C 360 180, 390 200, 375 225 C 365 240, 400 230, 415 250" fill="none" stroke="#ff1744" stroke-width="2.2" filter="url(#neon-glow-red)" />
  <path d="M 335 190 C 370 170, 410 190, 390 220 C 380 235, 410 240, 420 260" fill="none" stroke="#ff4d66" stroke-width="1.5" />
  <path d="M 345 205 C 365 195, 385 210, 400 240" fill="none" stroke="#00e5ff" stroke-width="1" stroke-dasharray="2,3" opacity="0.8" />

  <!-- YOLOv8 Bounding Box in Neon Red -->
  <rect x="250" y="170" width="180" height="110" rx="4" fill="rgba(255, 23, 68, 0.08)" stroke="#ff1744" stroke-width="1.6" />
  <!-- Corner Brackets in Neon Red -->
  <path d="M 250 185 L 250 170 L 265 170" fill="none" stroke="#ff1744" stroke-width="3" />
  <path d="M 415 170 L 430 170 L 430 185" fill="none" stroke="#ff1744" stroke-width="3" />
  <path d="M 250 265 L 250 280 L 265 280" fill="none" stroke="#ff1744" stroke-width="3" />
  <path d="M 415 280 L 430 280 L 430 265" fill="none" stroke="#ff1744" stroke-width="3" />

  <!-- Bounding Box Detection Tag -->
  <rect x="250" y="148" width="158" height="20" rx="3" fill="#ff1744" />
  <text x="256" y="162" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800">SPAGHETTI_DEFECT: 97.4%</text>

  <!-- Real-time HUD stats on camera overlay -->
  <text x="45" y="100" fill="#9da1b5" font-family="'JetBrains Mono', monospace" font-size="10">FPS: 30.2</text>
  <text x="45" y="115" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="10">INF: 17.8ms [YOLOv8n]</text>
  <text x="45" y="130" fill="#ff1744" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">STATUS: IRREGULARITY</text>

  <!-- Right Telemetry & Control Panel (Charcoal with Red/Blue accents) -->
  <rect x="555" y="75" width="215" height="345" rx="8" fill="#12131a" stroke="#252733" stroke-width="1" />
  
  <text x="570" y="105" fill="#f4f5f8" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">OCTOPRINT TELEMETRY</text>
  <line x1="570" y1="115" x2="755" y2="115" stroke="#252733" stroke-width="1" />

  <!-- Metrics Rows -->
  <text x="570" y="138" fill="#71758c" font-family="'JetBrains Mono', monospace" font-size="10">NOZZLE TEMP</text>
  <text x="570" y="154" fill="#f4f5f8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">210°C / 210°C</text>
  <rect x="570" y="162" width="185" height="4" rx="2" fill="#1e1f2b" />
  <rect x="570" y="162" width="185" height="4" rx="2" fill="#ff1744" />

  <text x="570" y="190" fill="#71758c" font-family="'JetBrains Mono', monospace" font-size="10">BED TEMPERATURE</text>
  <text x="570" y="206" fill="#f4f5f8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">60°C / 60°C</text>
  <rect x="570" y="214" width="185" height="4" rx="2" fill="#1e1f2b" />
  <rect x="570" y="214" width="185" height="4" rx="2" fill="#00e5ff" />

  <text x="570" y="242" fill="#71758c" font-family="'JetBrains Mono', monospace" font-size="10">PRINT PROGRESS (LAYER 142)</text>
  <text x="570" y="258" fill="#ff1744" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">48.4% [PAUSE_TRIGGERED]</text>
  
  <!-- System Safety Action Badge (Neon Red border) -->
  <rect x="570" y="280" width="185" height="45" rx="6" fill="#171822" stroke="#ff1744" stroke-width="1" />
  <circle cx="584" cy="302" r="3.5" fill="#ff1744" filter="url(#neon-glow-red)" />
  <text x="594" y="298" fill="#ff1744" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">AUTONOMOUS PAUSE</text>
  <text x="594" y="313" fill="#9da1b5" font-family="'JetBrains Mono', monospace" font-size="9">OctoPrint API triggered</text>

  <!-- Connectivity Footnote with Neon Blue hint -->
  <rect x="570" y="340" width="185" height="60" rx="6" fill="#0c0d12" stroke="#252733" stroke-width="1" />
  <text x="582" y="360" fill="#71758c" font-family="'JetBrains Mono', monospace" font-size="9">GATEWAY: Raspberry Pi 4B</text>
  <text x="582" y="375" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="9">SOCKET: WSS /sockjs/websocket</text>
  <text x="582" y="390" fill="#ff1744" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">DISPATCH CONFIRMED: 0.12s</text>
</svg>
