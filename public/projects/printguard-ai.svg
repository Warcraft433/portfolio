<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-obsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#101014" />
      <stop offset="100%" stopColor="#19191F" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#D6B77A" />
      <stop offset="100%" stopColor="#DECBA1" />
    </linearGradient>
    <filter id="gold-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bg-obsidian)" />
  
  <!-- Subtle Minimal Grid Lines -->
  <g stroke="#303038" stroke-width="0.8" opacity="0.3">
    <line x1="40" y1="0" x2="40" y2="450" />
    <line x1="120" y1="0" x2="120" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="280" y1="0" x2="280" y2="450" />
    <line x1="360" y1="0" x2="360" y2="450" />
    <line x1="440" y1="0" x2="440" y2="450" />
    <line x1="520" y1="0" x2="520" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="680" y1="0" x2="680" y2="450" />
    <line x1="760" y1="0" x2="760" y2="450" />
    <line x1="0" y1="60" x2="800" y2="60" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="0" y1="420" x2="800" y2="420" />
  </g>

  <!-- Window Header Bar -->
  <rect x="30" y="25" width="740" height="38" rx="8" fill="#19191F" stroke="#303038" stroke-width="1" />
  <circle cx="50" cy="44" r="5" fill="#D6B77A" opacity="0.9" />
  <circle cx="68" cy="44" r="5" fill="#777783" opacity="0.6" />
  <circle cx="86" cy="44" r="5" fill="#777783" opacity="0.6" />
  <text x="110" y="48" fill="#777783" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">PrintGuard AI — Edge Computer Vision Telemetry Feed [CAM_01: ACTIVE]</text>
  <rect x="680" y="34" width="75" height="20" rx="4" fill="rgba(214, 183, 122, 0.12)" stroke="#D6B77A" stroke-width="1" />
  <text x="696" y="48" fill="#D6B77A" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">ONLINE</text>

  <!-- Left Camera Stream Viewport Container -->
  <rect x="30" y="75" width="510" height="345" rx="8" fill="#14141A" stroke="#303038" stroke-width="1" />
  
  <!-- Optical Crosshair -->
  <line x1="285" y1="85" x2="285" y2="410" stroke="#777783" stroke-width="0.8" stroke-dasharray="3,6" opacity="0.4" />
  <line x1="40" y1="247" x2="530" y2="247" stroke="#777783" stroke-width="0.8" stroke-dasharray="3,6" opacity="0.4" />
  
  <!-- Simulated 3D Printer Heated Bed Wireframe -->
  <polygon points="120,340 450,340 490,260 160,260" fill="#1D1D24" stroke="#303038" stroke-width="1.2" />
  <polygon points="200,285 410,285 435,230 225,230" fill="#24242E" stroke="#777783" stroke-width="0.8" opacity="0.8" />
  
  <!-- 3D Printed Part Outline with Defect Formation -->
  <path d="M 270 270 L 270 190 L 340 190 L 340 270 Z" fill="#2C2C38" stroke="#D6B77A" stroke-width="1.5" stroke-opacity="0.8" />
  <!-- Filament Spaghetti Failure Threads -->
  <path d="M 330 195 C 360 180, 390 200, 375 225 C 365 240, 400 230, 415 250" fill="none" stroke="#D6B77A" stroke-width="1.8" filter="url(#gold-blur)" />
  <path d="M 335 190 C 370 170, 410 190, 390 220 C 380 235, 410 240, 420 260" fill="none" stroke="#DECBA1" stroke-width="1.2" />

  <!-- YOLOv8 Bounding Box in Champagne Gold -->
  <rect x="250" y="170" width="180" height="110" rx="4" fill="rgba(214, 183, 122, 0.06)" stroke="#D6B77A" stroke-width="1.6" />
  <!-- Bounding Box Corner Brackets -->
  <path d="M 250 185 L 250 170 L 265 170" fill="none" stroke="#D6B77A" stroke-width="3" />
  <path d="M 415 170 L 430 170 L 430 185" fill="none" stroke="#D6B77A" stroke-width="3" />
  <path d="M 250 265 L 250 280 L 265 280" fill="none" stroke="#D6B77A" stroke-width="3" />
  <path d="M 415 280 L 430 280 L 430 265" fill="none" stroke="#D6B77A" stroke-width="3" />

  <!-- Bounding Box Detection Label -->
  <rect x="250" y="148" width="150" height="20" rx="3" fill="#D6B77A" />
  <text x="256" y="162" fill="#101014" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800">SPAGHETTI_DEFECT: 96.8%</text>

  <!-- Real-time HUD stats on camera overlay -->
  <text x="45" y="100" fill="#777783" font-family="'JetBrains Mono', monospace" font-size="10">FPS: 30.2</text>
  <text x="45" y="115" fill="#777783" font-family="'JetBrains Mono', monospace" font-size="10">INF: 17.8ms [YOLOv8n]</text>
  <text x="45" y="130" fill="#D6B77A" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">STATUS: IRREGULARITY</text>

  <!-- Right Telemetry & Control Panel -->
  <rect x="555" y="75" width="215" height="345" rx="8" fill="#19191F" stroke="#303038" stroke-width="1" />
  
  <text x="570" y="105" fill="#F7F5F0" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">OCTOPRINT TELEMETRY</text>
  <line x1="570" y1="115" x2="755" y2="115" stroke="#303038" stroke-width="1" />

  <!-- Metrics Rows -->
  <text x="570" y="138" fill="#777783" font-family="'JetBrains Mono', monospace" font-size="10">NOZZLE TEMP</text>
  <text x="570" y="154" fill="#F7F5F0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">210°C / 210°C</text>
  <rect x="570" y="162" width="185" height="4" rx="2" fill="#24242E" />
  <rect x="570" y="162" width="185" height="4" rx="2" fill="#D6B77A" />

  <text x="570" y="190" fill="#777783" font-family="'JetBrains Mono', monospace" font-size="10">BED TEMPERATURE</text>
  <text x="570" y="206" fill="#F7F5F0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">60°C / 60°C</text>
  <rect x="570" y="214" width="185" height="4" rx="2" fill="#24242E" />
  <rect x="570" y="214" width="185" height="4" rx="2" fill="#D6B77A" />

  <text x="570" y="242" fill="#777783" font-family="'JetBrains Mono', monospace" font-size="10">PRINT PROGRESS (LAYER 142)</text>
  <text x="570" y="258" fill="#D6B77A" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">48.4% [PAUSE_TRIGGERED]</text>
  
  <!-- System Safety Action Badge -->
  <rect x="570" y="280" width="185" height="45" rx="6" fill="#22222A" stroke="#D6B77A" stroke-width="1" />
  <text x="582" y="298" fill="#D6B77A" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">AUTONOMOUS PAUSE</text>
  <text x="582" y="313" fill="#777783" font-family="'JetBrains Mono', monospace" font-size="9">Material save: ~180g spared</text>

  <!-- Connectivity Footnote -->
  <rect x="570" y="340" width="185" height="60" rx="6" fill="#14141A" stroke="#303038" stroke-width="1" />
  <text x="582" y="360" fill="#777783" font-family="'JetBrains Mono', monospace" font-size="9">GATEWAY: Raspberry Pi 4B</text>
  <text x="582" y="375" fill="#777783" font-family="'JetBrains Mono', monospace" font-size="9">API HOOK: POST /api/job [pause]</text>
  <text x="582" y="390" fill="#D6B77A" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">DISPATCH CONFIRMED: 0.12s</text>
</svg>
